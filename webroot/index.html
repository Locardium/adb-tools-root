<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADB Wireless Config</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: var(--text);
            box-sizing: border-box;
        }
        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ADB Settings</h1>
        <form onsubmit="saveSettings(event)">
            <div class="form-group toggle">
                <input type="checkbox" id="wireless" name="wireless" checked>
                <label for="wireless" style="margin:0;">Enable Wireless ADB on Boot</label>
            </div>
            
            <div class="form-group">
                <label for="adb_port">Wireless ADB Port</label>
                <input type="number" id="adb_port" name="adb_port" value="5555" min="1" max="65535" required>
            </div>

            <div class="form-group toggle">
                <input type="checkbox" id="usb" name="usb" checked>
                <label for="usb" style="margin:0;">Enable USB ADB on Boot</label>
            </div>

            <button type="submit">Save & Apply</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        async function saveSettings(event) {
            event.preventDefault();
            const wireless = document.getElementById('wireless').checked;
            const usb = document.getElementById('usb').checked;
            const port = document.getElementById('adb_port').value;
            const msgBox = document.getElementById('message');

            msgBox.style.display = 'block';
            msgBox.style.color = '#3b82f6';
            msgBox.textContent = 'Applying...';
            
            // Try KSU WebUI API first
            if (typeof ksu !== 'undefined' && ksu.exec) {
                const cmd = `sh /data/adb/modules/adb-tools-root/action.sh save ${wireless} ${usb} ${port}`;
                await ksu.exec(cmd);
                msgBox.style.color = '#10b981';
                msgBox.textContent = 'Settings Applied Successfully (KSU WebUI)';
            } else if (window.ksu && window.ksu.exec) {
                const cmd = `sh /data/adb/modules/adb-tools-root/action.sh save ${wireless} ${usb} ${port}`;
                await window.ksu.exec(cmd);
                msgBox.style.color = '#10b981';
                msgBox.textContent = 'Settings Applied Successfully (KSU WebUI)';
            } else {
                // Fallback for standard browsers via busybox httpd
                window.location.href = `/cgi-bin/save.sh?wireless=${wireless ? 'on' : 'off'}&usb=${usb ? 'on' : 'off'}&adb_port=${port}`;
            }
        }
    </script>
</body>
</html>
